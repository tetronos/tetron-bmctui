[package]
name = "tetron-bmctui"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Terminal UI for server BMCs over IPMI"
license = "MPL-2.0"
repository = "https://github.com/tetronos/tetron-bmctui"
keywords = ["bmc", "ipmi", "tui", "server"]
publish = false

[dependencies]
crossterm = "0.29"
libc = "0.2.191"
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde"] }
vt100 = "0.18.1"

[profile.release]
lto = "thin"
strip = true
